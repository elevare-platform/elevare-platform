services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elevare-api
    ports:
      - "127.0.0.1:8080:8000"
    
    env_file:
      - ./backend/.env.production
    
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips='*'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  
  db:
    image: pgvector/pgvector:pg16
    container_name: elevare-db
    env_file:
      - ./backend/.env.production
    environment:
      POSTGRES_USER: elevare
      POSTGRES_PASSWORD: elevare_production
      POSTGRES_DB: elevare_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elevare -d elevare_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: elevare-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elevare-worker
    env_file:
      - ./backend/.env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 2G was too tight: idle baseline (NLP libs loaded at worker
          # startup) alone measured ~920MiB, leaving barely enough headroom
          # for 2 concurrent CV-parsing/OCR tasks before hitting the
          # ceiling and getting SIGKILLed. Host has room (7.8G total, other
          # services running well under their own limits).
          cpus: '1.0'
          memory: 3G
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # --concurrency=2: without it, Celery defaults to one forked child per
    # CPU core as reported by the container (cgroup CPU quotas below don't
    # change what os.cpu_count() returns), which on a multi-core host can
    # mean several memory-heavy children (CV parsing/OCR, embedding calls)
    # all competing for this service's 2G memory limit below.
    # -Q celery: this worker handles only the default queue (CV parsing,
    # scoring, embeddings, notifications) — mail ingestion is routed to
    # celery_worker_ingestion below so a burst of imports can never stall
    # everything else.
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2 -Q celery
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  celery_worker_ingestion:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elevare-worker-ingestion
    env_file:
      - ./backend/.env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Mail ingestion is I/O-bound (network calls to Zoho/Gmail,
          # attachment downloads) — it dispatches CV parsing/OCR/embedding
          # work to celery_worker via separate tasks rather than doing any
          # of that heavy lifting itself, so it needs far less memory per
          # process than celery_worker does. Higher concurrency is safe
          # here for the same reason: these processes spend most of their
          # time waiting on network I/O, not competing for CPU/memory.
          cpus: '0.5'
          memory: 512M
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 -Q ingestion
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elevare-beat
    env_file:
      - ./backend/.env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: celery -A app.core.celery_app beat --loglevel=info
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  redis_data: